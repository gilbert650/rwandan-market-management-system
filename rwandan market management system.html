<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rwandan Market Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
}

/* HEADER */
header{
    background:#006633;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:35px;
}

header p{
    margin-top:10px;
}

/* NAVIGATION */
nav{
    background:#004d26;
    padding:15px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

nav button{
    background:#ffd700;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* MAIN CONTAINER */
.container{
    padding:20px;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card h2{
    color:#006633;
}

.number{
    font-size:40px;
    margin-top:10px;
    color:#ff9800;
}

/* FORM */
.form-section{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.form-section h2{
    margin-bottom:15px;
    color:#006633;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.submit-btn{
    background:#006633;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

table th{
    background:#006633;
    color:white;
    padding:12px;
}

table td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#006633;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

@media(max-width:768px){
    table{
        font-size:12px;
    }
}
</style>
</head>
<body>

<header>
    <h1>🛒 Rwanda Market Management System</h1>
    <p>Vendor, Product & Sales Management</p>
</header>

<nav>
    <button onclick="showProducts()">Products</button>
    <button onclick="showVendors()">Vendors</button>
    <button onclick="showSales()">Sales</button>
    <button onclick="showReports()">Reports</button>
</nav>

<div class="container">

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card">
            <h2>Total Products</h2>
            <div class="number" id="productsCount">0</div>
        </div>

        <div class="card">
            <h2>Total Vendors</h2>
            <div class="number" id="vendorsCount">0</div>
        </div>

        <div class="card">
            <h2>Total Sales</h2>
            <div class="number" id="salesCount">0</div>
        </div>

        <div class="card">
            <h2>Total Revenue</h2>
            <div class="number" id="revenue">0 RWF</div>
        </div>

    </div>

    <!-- PRODUCT FORM -->
    <div class="form-section">

        <h2>Add Product</h2>

        <input type="text" id="productName" placeholder="Product Name">

        <input type="text" id="vendorName" placeholder="Vendor Name">

        <select id="category">
            <option>Food</option>
            <option>Clothes</option>
            <option>Electronics</option>
            <option>Fruits</option>
            <option>Vegetables</option>
        </select>

        <input type="number" id="price" placeholder="Price in RWF">

        <input type="number" id="quantity" placeholder="Quantity">

        <button class="submit-btn" onclick="addProduct()">
            Add Product
        </button>

    </div>

    <!-- PRODUCT TABLE -->
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Vendor</th>
                <th>Category</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="productTable"></tbody>

    </table>

</div>

<footer>
    Rwanda Market Management System Using HTML, CSS, JavaScript, Node.js & SQL
</footer>

<script>

/*
=================================================
MYSQL DATABASE
=================================================

CREATE DATABASE rwanda_market;

USE rwanda_market;

CREATE TABLE products(
    id INT AUTO_INCREMENT PRIMARY KEY,
    product_name VARCHAR(100),
    vendor_name VARCHAR(100),
    category VARCHAR(100),
    price INT,
    quantity INT
);

=================================================
NODE.JS SERVER
=================================================

const express = require("express");
const mysql = require("mysql2");

const app = express();

app.use(express.json());

const db = mysql.createConnection({
    host:"localhost",
    user:"root",
    password:"",
    database:"rwanda_market"
});

db.connect();

app.post("/add-product",(req,res)=>{

    const data = req.body;

    db.query(
        "INSERT INTO products(product_name,vendor_name,category,price,quantity) VALUES(?,?,?,?,?)",
        [
            data.product_name,
            data.vendor_name,
            data.category,
            data.price,
            data.quantity
        ],
        (err,result)=>{
            if(err) throw err;

            res.send("Product added successfully");
        }
    );
});

app.listen(3000,()=>{
    console.log("Server running on port 3000");
});

=================================================
*/

// FRONTEND SYSTEM

let products = [];

const productTable = document.getElementById("productTable");

// UPDATE DASHBOARD
function updateDashboard(){

    document.getElementById("productsCount")
    .innerText = products.length;

    // COUNT UNIQUE VENDORS
    const vendors = [...new Set(
        products.map(p => p.vendor)
    )];

    document.getElementById("vendorsCount")
    .innerText = vendors.length;

    document.getElementById("salesCount")
    .innerText = products.length;

    let totalRevenue = 0;

    products.forEach(product=>{
        totalRevenue += product.total;
    });

    document.getElementById("revenue")
    .innerText = totalRevenue + " RWF";
}

// ADD PRODUCT
function addProduct(){

    const productName =
    document.getElementById("productName").value;

    const vendorName =
    document.getElementById("vendorName").value;

    const category =
    document.getElementById("category").value;

    const price =
    parseInt(document.getElementById("price").value);

    const quantity =
    parseInt(document.getElementById("quantity").value);

    if(
        !productName ||
        !vendorName ||
        !price ||
        !quantity
    ){
        alert("Please fill all fields");
        return;
    }

    const total = price * quantity;

    const product = {
        id: Date.now(),
        productName,
        vendor: vendorName,
        category,
        price,
        quantity,
        total
    };

    products.push(product);

    renderProducts();

    updateDashboard();

    clearForm();

    alert("Product added successfully!");
}

// DISPLAY PRODUCTS
function renderProducts(){

    productTable.innerHTML = "";

    products.forEach((product,index)=>{

        productTable.innerHTML += `
        <tr>

            <td>${product.id}</td>

            <td>${product.productName}</td>

            <td>${product.vendor}</td>

            <td>${product.category}</td>

            <td>${product.price} RWF</td>

            <td>${product.quantity}</td>

            <td>${product.total} RWF</td>

            <td>
                <button class="delete-btn"
                onclick="deleteProduct(${index})">
                    Delete
                </button>
            </td>

        </tr>
        `;
    });
}

// DELETE PRODUCT
function deleteProduct(index){

    products.splice(index,1);

    renderProducts();

    updateDashboard();
}

// CLEAR FORM
function clearForm(){

    document.getElementById("productName").value = "";

    document.getElementById("vendorName").value = "";

    document.getElementById("price").value = "";

    document.getElementById("quantity").value = "";
}

// NAVIGATION DEMO
function showProducts(){
    alert("Viewing Products");
}

function showVendors(){
    alert("Viewing Vendors");
}

function showSales(){
    alert("Viewing Sales");
}

function showReports(){
    alert("Viewing Reports");
}

// INITIAL LOAD
updateDashboard();

</script>

</body>
</html>
